name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Install Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install Dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and Publish Electron App (macOS)
      if: matrix.os == 'macos-latest'
      # release:mac adds the macOS floor to latest-mac.yml before it uploads the release.
      run: pnpm run release:mac
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    - name: Build and Publish Electron App (Windows)
      if: matrix.os == 'windows-latest'
      run: pnpm run build:all && pnpm exec electron-builder --win --publish always
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

    - name: Build and Publish Electron App (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: pnpm run build:all && pnpm exec electron-builder --linux --publish always
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
