name: Tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['dev', 'main']

jobs:
    test:
        name: Run Unit Tests
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Test desktop app
              run: pnpm test

            - name: Test web app
              run: pnpm --filter whisper-frontend test

            - name: Lint web app
              run: pnpm run web:lint

            - name: Type-check web app
              run: pnpm run web:type-check
