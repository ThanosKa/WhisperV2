name: Tests

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['dev', 'main']

jobs:
    test:
        name: Type-check and test
        runs-on: macos-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type-check
              run: pnpm type-check

            # Vitest for the app and the dashboard, then the Jest suites not yet moved to Vitest.
            - name: Test
              run: pnpm test

            # Until the oxlint setup adds the repo-wide lint step.
            - name: Lint web app
              run: pnpm run web:lint
