# electron-builder.yml
# The unique application ID
appId: com.whisper.app

# The user-facing application name
productName: Whisper

# Publish configuration for GitHub releases
publish:
    provider: github
    owner: ThanosKa
    repo: whisper-desktop
    releaseType: draft

# Protocols configuration for deep linking
protocols:
    name: Whisper Protocol
    schemes:
        - whisper

# List of files to be included in the app package
files:
    - src/**/*
    - package.json
    - whisper_web/backend_node/dist/**/*
    - '!**/node_modules/electron/**'
    - public/build/**/*

# Additional resources to be copied into the app's resources directory
extraResources:
    - from: whisper_web/out
      to: out

# Every native module ships prebuilt binaries (better-sqlite3's N-API prebuilds, sharp's @img
# packages), so nothing is compiled at packaging time.
npmRebuild: false

asarUnpack:
    - 'src/ui/assets/SystemAudioDump'
    - '**/node_modules/sharp/**/*'
    - '**/node_modules/@img/**/*'

# Hook to run after signing (for notarization)
afterSign: notarize.js

# Windows configuration
win:
    executableName: whisper # Creates whisper.exe to fix "Open Electron?" issue
    icon: src/ui/assets/wlogo.ico
    target:
        - target: nsis
          arch: x64
    requestedExecutionLevel: asInvoker
    signAndEditExecutable:
        false
        # cscLink: build\certs\glass-dev.pfx
        # cscKeyPassword: '${env.CSC_KEY_PASSWORD}'
        # signtoolOptions:
        #     certificateSubjectName: 'Whisper Dev Code Signing'

# NSIS installer configuration for Windows
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
    deleteAppDataOnUninstall: true
    createDesktopShortcut: always
    createStartMenuShortcut: true
    shortcutName: Whisper

# macOS specific configuration
mac:
    # The application category type
    category: public.app-category.utilities
    # Path to the .icns icon file
    icon: src/ui/assets/wlogo.icns
    # Minimum macOS version, written to Info.plist as LSMinimumSystemVersion. Electron 44 and
    # later need macOS 13. The update feed carries the same floor as a Darwin version (see
    # scripts/add-mac-feed-minimum-system-version.js).
    minimumSystemVersion: '13.0'
    # The x64 and arm64 builds both carry the prebuilt binaries of both architectures
    # (pnpm-workspace.yaml supportedArchitectures), so the universal merge finds the same Mach-O
    # files in both. They are already per-architecture: keep one copy.
    x64ArchFiles: 'Contents/Resources/app.asar.unpacked/node_modules/{@img/sharp-*,better-sqlite3}/**'
    hardenedRuntime: true
    entitlements: entitlements.plist
    entitlementsInherit: entitlements.plist
    notarize: false
    # Code signing identity
    identity: 'Thanos Kazakis (GJ3U78VY54)'
    target:
        - target: dmg
          arch: universal
        - target: zip
          arch: universal

# Linux configuration
linux:
    # The application category
    category: AudioVideo
    # Path to the icon file
    icon: src/ui/assets/wlogo.png
    # Desktop entry configuration (updated for electron-builder v26)
    desktop:
        entry:
            Name: Whisper
            Comment: Audio recording and transcription application
            Categories: AudioVideo;Audio;Utility;
    # Package targets
    target:
        - target: AppImage
          arch: [x64, arm64]
        - target: deb
          arch: [x64, arm64]
        - target: rpm
          arch: [x64, arm64]
