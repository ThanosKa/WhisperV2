packages:
    - whisper_web

# A flat, npm-like node_modules: what electron-builder packages from.
nodeLinker: hoisted

# Packages whose install scripts may run. Everything else is denied.
allowBuilds:
    esbuild: true
    electron-winstaller: false

# Install the optional binaries (sharp's @img/*) for both macOS architectures, for the universal build.
supportedArchitectures:
    os: [current]
    cpu: [current, x64, arm64]

permissions:
  dotenv:
    skills: false

# Peer ranges that are older than what runs here, accepted on purpose (ticket 06 of step 2-3):
# - lucide-react stays on 0.294: every release that lists React 19 redraws icons the dashboard uses,
#   and the dashboard must look the same until its new look (steps 5-6). It runs on React 19 unchanged.
# - eslint-config-next 16 ships these plugins and wraps them for ESLint 10 (fixupPluginRules).
peerDependencyRules:
    allowedVersions:
        lucide-react>react: '19'
        eslint-plugin-import>eslint: '10'
        eslint-plugin-jsx-a11y>eslint: '10'
        eslint-plugin-react>eslint: '10'
